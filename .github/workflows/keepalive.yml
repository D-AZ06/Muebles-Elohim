# Consulta Supabase una vez al día para que el plan gratis no lo pause por inactividad.
# Requiere los secrets SUPABASE_URL y SUPABASE_KEY (clave anon) en GitHub.
name: keepalive
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl -fsS "${{ secrets.https://dhqcnrgknozpixhplobn.supabase.co }}/rest/v1/catalogo_fotos?select=id&limit=1" \
            -H "apikey: ${{ secrets.sb_publishable_TA_wtoUILVgRNsQ8iAZ9xw_TcXNwhtk }}"